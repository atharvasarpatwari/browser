appId: com.nova.browser
productName: Nova Browser
copyright: "© 2026 Nova Browser"
# Actual uploading is handled by the release workflow's own
# softprops/action-gh-release step — the build scripts pass --publish=never
# so electron-builder never uploads itself, but it still needs this provider
# config to generate latest.yml/latest-mac.yml/latest-linux.yml (the
# manifests electron-updater reads) with the right repo info.
publish:
  provider: github
  owner: atharvasarpatwari
  repo: browser
directories:
  output: release
  buildResources: build
files:
  - electron/**
  - dist/index.html
  - dist/assets/**
asar: true
npmRebuild: false
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.png
  category: public.app-category.browsers
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  icon: build/icon.png
  category: Network
  mimeTypes:
    - text/html
    - application/xhtml+xml
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Nova Browser
  artifactName: "${productName} Setup ${version}.${ext}"
electronDownload:
  cache: null
