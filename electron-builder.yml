appId: com.nova.browser
productName: Nova Browser
copyright: "© 2026 Nova Browser"
# Publishing is handled by the release workflow's own softprops/action-gh-release
# step, not electron-builder — leave this unset so a tag push doesn't also
# trigger electron-builder's own (unauthenticated) implicit publish attempt.
publish: null
directories:
  output: release
  buildResources: build
files:
  - electron/**
  - dist/index.html
  - dist/assets/**
asar: true
npmRebuild: false
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.png
  category: public.app-category.browsers
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  icon: build/icon.png
  category: Network
  mimeTypes:
    - text/html
    - application/xhtml+xml
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Nova Browser
  artifactName: "${productName} Setup ${version}.${ext}"
electronDownload:
  cache: null
