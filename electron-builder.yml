appId: com.nova.browser
productName: Nova Browser
copyright: "© 2026 Nova Browser"
publish:
  provider: github
  owner: atharvasarpatwari
  repo: browser
directories:
  output: release
  buildResources: build
files:
  - electron/**
  - dist/index.html
  - dist/assets/**
  - dist-main/**
  - "!node_modules/**"
# NOTE: node-sqlite3-wasm (runtime dep of dist-main/browser/crawler/*) is excluded by
# "!node_modules/**" above like everything else in node_modules. Not yet verified whether
# electron-builder's own production-dependency walk re-includes it despite this glob —
# needs a real packaged-build smoke test before shipping the crawler feature.
asar: true
npmRebuild: false
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.png
  category: public.app-category.browsers
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  icon: build/icon.png
  category: Network
  mimeTypes:
    - text/html
    - application/xhtml+xml
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Nova Browser
  artifactName: "${productName} Setup ${version}.${ext}"
electronDownload:
  cache: null
