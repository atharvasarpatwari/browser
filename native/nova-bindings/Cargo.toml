[package]
name = "nova-bindings"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nova Browser — N-API bindings for Node.js"

[package.metadata.napi]
name = "nova_bindings"

[package.metadata.napi.targets]
linux-x64 = { target = "x86_64-unknown-linux-gnu" }
linux-arm64 = { target = "aarch64-unknown-linux-gnu" }
darwin-x64 = { target = "x86_64-apple-darwin" }
darwin-arm64 = { target = "aarch64-apple-darwin" }
win32-x64 = { target = "x86_64-pc-windows-msvc" }

[lib]
crate-type = ["cdylib"]

[features]
default = ["dns"]
dns = ["nova-net/dns"]
tls = ["nova-net/tls"]
http = ["nova-net/http"]

[dependencies]
nova-net = { path = "../nova-net", default-features = false }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
napi = { version = "2", features = ["async", "serde-json"] }
napi-derive = "2"
log.workspace = true

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = 3
strip = "symbols"
