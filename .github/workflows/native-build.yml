name: Native Build Matrix

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/native-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'native/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  # ── Rust tests ─────────────────────────────────────────────────────────────
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: "dns,tls,http"

    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.target }})

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run sccache
        uses: Mozilla-Actions/sccache-action@v0.0.7

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ matrix.target }}-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ matrix.target }}-

      - name: Install Linux build deps (TLS)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libssl-dev

      - name: Run tests
        working-directory: .
        run: |
          cargo test \
            --workspace \
            --manifest-path native/Cargo.toml \
            --target ${{ matrix.target }} \
            --features ${{ matrix.features }} \
            --release

      - name: Print sccache stats
        if: always()
        run: sccache --show-stats

  # ── Build native .node binaries ────────────────────────────────────────────
  build-linux-x64:
    runs-on: ubuntu-latest
    name: build (linux-x64)

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Run sccache
        uses: Mozilla-Actions/sccache-action@v0.0.7

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-linux-x64-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: |
            cargo-registry-linux-x64-

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libssl-dev

      - name: Build release
        run: |
          cargo build \
            --release \
            --lib \
            --manifest-path native/Cargo.toml \
            --target x86_64-unknown-linux-gnu \
            --features dns,tls,http

      - name: Prepare output directory
        run: |
          mkdir -p native/dist/linux-x64-x64
          cp native/target/x86_64-unknown-linux-gnu/release/libnova_bindings.so \
             native/dist/linux-x64-x64/nova_bindings.node

      - name: Verify binary
        run: |
          file native/dist/linux-x64-x64/nova_bindings.node
          ls -lh native/dist/linux-x64-x64/nova_bindings.node

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-bindings-linux-x64
          path: native/dist/linux-x64-x64/nova_bindings.node
          retention-days: 30

      - name: Print sccache stats
        if: always()
        run: sccache --show-stats

