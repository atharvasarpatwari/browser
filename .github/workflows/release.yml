name: Release Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifact: win
          - os: macos-latest
            script: build:mac
            artifact: mac
          - os: ubuntu-latest
            script: build:linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    name: Build and publish installer (${{ matrix.os }})

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer (${{ matrix.os }})
        run: npm run ${{ matrix.script }}
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify installer artifacts
        shell: pwsh
        run: Get-ChildItem -Path release -Recurse | Select-Object Name, Length

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Nova Browser ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.yml