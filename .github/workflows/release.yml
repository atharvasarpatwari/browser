name: Release Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    name: Build and publish installer

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build:win
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache

      - name: Verify installer artifact
        run: Get-ChildItem -Path release -Filter "*.exe" | Select-Object Name, Length

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Nova Browser ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
